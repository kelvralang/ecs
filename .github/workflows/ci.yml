name: Package CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.target }} / Kelvra ${{ matrix.runtime_ref }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64-gnu
            runtime_ref: main
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu
            runtime_ref: main
          - runner: macos-14
            target: macos-arm64
            runtime_ref: main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kelvralang/kelvra
          ref: ${{ matrix.runtime_ref }}
          path: .runtime/kelvra
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' kelvra.toml | head -n 1)"
          native_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' native/kelvra.toml | head -n 1)"
          test -n "$version"
          test "$native_version" = "$version"
          test -f LICENSE
          test -f package.api.kel
          test -f native/package.api.kel
          test -f tests/sample_ecs_wrapper.kel
          grep -Fq "## $version" CHANGELOG.md
          grep -Fq 'MIT License' LICENSE
          grep -q '^```kelvra' README.md
          grep -Fq '"${{ matrix.target }}"' native/kelvra.toml
          cmp NativePackageAPI.hpp .runtime/kelvra/src/NativePackageAPI.hpp
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          fi
      - name: Build Kelvra runtime
        run: |
          cmake -S .runtime/kelvra -B .runtime/kelvra/build -DCMAKE_BUILD_TYPE=Release
          cmake --build .runtime/kelvra/build --parallel
      - name: Build and test ECS package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DKELVRA_EXECUTABLE="$GITHUB_WORKSPACE/.runtime/kelvra/build/kelvra"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  validate:
    if: always()
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require compatibility matrix
        env:
          RESULT: ${{ needs.compatibility.result }}
        run: test "$RESULT" = success
